<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Nightgrave</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #0b0d12; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* keep the canvas (buttons, HUD) inside the safe area around a phone notch */
      #game {
        position: fixed; inset: 0; box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex; align-items: center; justify-content: center; touch-action: none;
      }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; touch-action: none; }
      #rotate {
        position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: #0b0d12; color: #d9d2c0; font: 12px "Press Start 2P", monospace; text-align: center; padding: 24px;
      }
      #rotate[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" hidden>Rotate your device</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
